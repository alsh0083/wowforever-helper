# Consensus-backed scenario weights (#24). Owner rules (#23): reputable guides and forums only,
# no gold/boost/carry sellers, robots.txt-permitted sources only (no Wowhead, no Reddit).
# Classic-era evidence counts at full confidence only for talents Forever left unchanged.
#
# axes: kill (damage/time to kill), endurance (mana/downtime), survival, control.
# Each axis weight is [low, mid, high]; the mids of a scenario sum to 1.
# confidence: low | medium | high.

