# ---- scenario axis weights ------------------------------------------------------------------

[scenario.questing]
kill = [0.35, 0.45, 0.55]
endurance = [0.25, 0.35, 0.45]
survival = [0.10, 0.15, 0.25]
control = [0.0, 0.05, 0.10]
sources = ["method_forever_leveling", "wt_forever_mage"]
confidence = "medium"
note = "Forever guides stress survivability and kiting while leveling; downtime drives kills/hour."

[scenario.aoe]
kill = [0.30, 0.40, 0.50]
endurance = [0.20, 0.30, 0.40]
survival = [0.05, 0.10, 0.20]
control = [0.10, 0.20, 0.30]
sources = ["wt_forever_mage", "method_forever_leveling", "bnet_forever_mage_pvp"]
confidence = "low"
note = "AoE was tuned down in Forever (guides and forums agree); kiting slows matter more than in Classic. How much is unknown."

[scenario.dungeon]
kill = [0.45, 0.55, 0.65]
endurance = [0.20, 0.30, 0.40]
survival = [0.05, 0.10, 0.15]
control = [0.0, 0.05, 0.10]
sources = ["wt_forever_mage"]
confidence = "low"
note = "One Forever source (dungeon Arcane builds to 30); weights mostly by analogy to raids."

[scenario.raid]
kill = [0.60, 0.70, 0.80]
endurance = [0.20, 0.30, 0.40]
survival = [0.0, 0.0, 0.05]
control = [0.0, 0.0, 0.05]
sources = ["barrens_specs_60"]
confidence = "medium"
note = "Classic consensus: raid value is sustained damage limited by mana."

[scenario.wpvp_melee]
kill = [0.20, 0.30, 0.40]
endurance = [0.0, 0.05, 0.10]
survival = [0.25, 0.30, 0.40]
control = [0.25, 0.35, 0.45]
sources = ["bnet_forever_mage_pvp", "barrens_pvp_builds", "wt_tbc_frost_pvp"]
confidence = "medium"
note = "Kiting (slows, roots, Frost Nova) and defensives decide melee fights; Forever players expect Frost."

[scenario.wpvp_caster]
kill = [0.30, 0.40, 0.50]
endurance = [0.0, 0.05, 0.10]
survival = [0.30, 0.40, 0.50]
control = [0.10, 0.15, 0.25]
sources = ["bnet_forever_mage_pvp", "prior_research"]
confidence = "low"
note = "Casting through damage (Ice Barrier, Burning Soul) and burst matter most; little direct evidence."

[scenario.stealth_ambush]
kill = [0.10, 0.20, 0.30]
endurance = [0.0, 0.0, 0.05]
survival = [0.40, 0.50, 0.60]
control = [0.20, 0.30, 0.40]
sources = ["bnet_forever_mage_pvp", "barrens_pvp_builds"]
confidence = "medium"
note = "Forever forum: without Ice Barrier mages die to rogue openers; Ice Block + Cold Snap as emergency buttons."

[scenario.battleground]
kill = [0.25, 0.35, 0.45]
endurance = [0.0, 0.05, 0.10]
survival = [0.25, 0.30, 0.40]
control = [0.20, 0.30, 0.40]
sources = ["barrens_pvp_builds", "bnet_forever_mage_pvp"]
confidence = "low"
note = "Group fights: AoE control and survival under focus; Forever AoE nerfs make Classic evidence weaker."

# ---- talent tiers per scenario (core > strong) ------------------------------------------------
# Talents named here get a consensus bonus on top of modeled value in v1 scoring (#25/#28).
# Per class: [tiers.<class>.<scenario>] (#321). A class without tiers gets no bonus.

[tiers.mage.wpvp_melee]
core = ["Ice Barrier", "Ice Block", "Cold Snap", "Permafrost", "Improved Frost Nova"]
strong = ["Frostbite", "Shatter", "Arctic Reach", "Improved Cone of Cold", "Blast Wave"]
sources = ["barrens_pvp_builds", "wt_tbc_frost_pvp", "bnet_forever_mage_pvp"]

[tiers.mage.wpvp_caster]
core = ["Ice Barrier", "Ice Block", "Cold Snap"]
strong = ["Burning Soul", "Improved Counterspell", "Impact", "Shatter"]
sources = ["bnet_forever_mage_pvp", "prior_research"]

[tiers.mage.stealth_ambush]
core = ["Ice Barrier", "Ice Block", "Cold Snap", "Improved Frost Nova"]
strong = ["Permafrost", "Frostbite", "Blast Wave", "Impact"]
sources = ["bnet_forever_mage_pvp", "barrens_pvp_builds"]

[tiers.mage.battleground]
core = ["Ice Block", "Cold Snap", "Ice Barrier"]
strong = ["Improved Frost Nova", "Permafrost", "Blast Wave", "Improved Blizzard"]
sources = ["barrens_pvp_builds"]

[tiers.mage.questing]
core = ["Improved Frostbolt", "Elemental Precision"]
strong = ["Ice Shards", "Shatter", "Frostbite", "Permafrost"]
sources = ["method_forever_leveling", "wt_forever_mage"]

