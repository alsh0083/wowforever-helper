# Unknown mechanics, modeled as explicit switches until in-game testing settles them.
# Each entry: the current default, the allowed values, why, and where the uncertainty comes from.
# When an in-game test settles one, set `tested` to "YYYY-MM-DD on <build>: <result>" and fix `value`.

[frostfire_periodic_can_crit]
value = true
options = [true, false]
why = "Client spell data flags Frostfire Bolt's periodic part as able to crit."
source = "docs/research/notes/mechanics.md (Wowhead client record for spell 401502)"
tested = ""
talents = ["Frostfire Bolt"]

[frostfire_ticks_trigger_impact]
value = false
options = [true, false]
why = "Unknown whether each Frostfire Bolt tick, or only the direct hit, can roll Impact's stun."
source = "docs/research/mage-pvp-leveling-report.md: open question"
tested = ""
talents = ["Frostfire Bolt", "Impact"]

[burning_soul_protects_frostfire]
value = true
options = [true, false]
why = "Burning Soul names Fire spells; Frostfire Bolt counts as both schools, so it probably applies."
source = "docs/research/mage-pvp-leveling-report.md: open question"
tested = ""
talents = ["Frostfire Bolt", "Burning Soul"]

[frostfire_interrupt_lockout]
value = "both"
options = ["both", "fire", "frost"]
why = "Which school(s) an interrupt locks when it lands on a Frostfire Bolt cast."
source = "docs/research/mage-pvp-leveling-report.md: open question"
tested = ""
talents = ["Frostfire Bolt"]

[fingers_of_frost_applies_to_frostfire]
value = false
options = [true, false]
why = "Unknown whether Fingers of Frost charges count Frostfire Bolt as a Frost spell."
source = "docs/research/mage-pvp-leveling-report.md: open question"
tested = ""
talents = ["Frostfire Bolt", "Fingers of Frost"]

[aoe_target_cap]
value = "none"
options = ["none", "soft_4"]
why = "Client data has no MaxTargets on mage AoE; players report damage falling off past 4 targets."
source = "docs/research/forever-facts.md; issue #19"
tested = ""
talents = ["Blizzard", "Flamestrike", "Arcane Explosion", "Cone of Cold", "Blast Wave"]

[sub20_spell_penalty]
value = true
options = [true, false]
why = "Classic cuts the spell power coefficient of spells learned below level 20 by 3.75% per level under 20; Forever client coefficients don't carry it (it's server-side)."
source = "warcraft.wiki.gg/wiki/downranking; issue #91"
tested = ""
talents = ["Frostbolt", "Fireball"]

[thorns_spell_power_coefficient]
value = 0.0
options = [0.0, 0.168]
why = "The client gives Thorns (damage shield, aura 15) no spell power coefficient, but damage-shield scaling can be server-side; Forever's spell power gear may make Thorns scale (owner question, #265)."
source = "client SpellEffect 9910 EffectBonusCoefficient 0 (build 1.60.1.70338); 0.168 is a later expansion's value, used only as the alternative to test"
tested = ""
talents = ["Thorns"]

[swiftmend_consumes_hot]
value = false
options = [false, true]
why = "Forever's Swiftmend heals for the HoT's full duration and, unlike Classic's text, doesn't say it consumes the HoT; if it does, Swiftmend only front-loads healing the HoT would have given (#279)."
source = "Swiftmend rank text, build 1.60.1.70291; Classic: 'Consumes a Rejuvenation or Regrowth effect'"
tested = ""
talents = ["Swiftmend"]

[roots_break_health_pct]
value = 10
options = [10, 0]
why = "Forever's Entangling Roots keeps 'Damage caused may interrupt the effect', and Improved Entangling Roots lets victims take 25/50/75% more damage before it breaks, so there is a damage threshold; no public source gives it. 10% of the rooted target's maximum health is AzerothCore's threshold; 0 = roots never break (#286)."
source = "Entangling Roots and Improved Entangling Roots rank texts, build 1.60.1.70338; azerothcore-wotlk issue #18787 (CountPctFromMaxHealth(10)); Blizzard on TBC Classic: a random range of damage, not a fixed amount"
tested = ""
talents = ["Improved Entangling Roots"]

[chain_jump_falloff_pct]
value = 30
options = [30, 0]
why = "Chain Lightning loses damage on each jump in Classic (30%); Forever's client data has neither the falloff nor the target count (#260)."
source = "Classic Chain Lightning text; dataset 1.60.1.70291 (MaxTargets 0, no falloff field)"
tested = ""
talents = ["Chain Lightning"]

[fire_power_effects]
value = 2
options = [1, 2, 3, 4]
why = "Fire Power (1.60.1.70425) adds its % once per Fire effect on the target, up to a cap. A Fire mage's boss keeps Ignite and Fireball's DoT up; Pyroblast's DoT and Flamestrike only some of the time."
source = "Fire Power rank text, 1.60.1.70425; issue #354"
tested = ""
talents = ["Fire Power"]
