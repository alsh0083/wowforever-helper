# Rogue Subtlety (Preparation/Premeditation): PvP opponent kit for the duel model (docs/design/pvp-duel-model.md).
# Spec chosen from wowforevertalent.com Forever popularity data plus PvP judgment.
# source per value: data = Forever client 1.60.1.70205 rogue spells and the talents of the rogue
# community build (#106, config/builds/rogue-*.toml); classic = Classic value the data doesn't carry;
# estimate = judgment. Health and DPS: level-60 values vs cloth from the melee engine (#147).

id = "rogue-subtlety"
class = "Rogue"
spec = "Subtlety (Preparation/Premeditation)"
points = "16/12/23"
role = "melee"  # melee | ranged | caster
stealth = true
dispels_buffs = false  # can strip Ice Barrier
confidence = "low"
sources = ["wft_popular", "wft_popular_rogue"]

[at_60]
health = 3280  # melee engine (#147), build rogue-subtlety
dps = 218  # melee engine (#147), build rogue-subtlety
opener_damage = 900
opener_stun = 4.0
opener_source = "data (Cheap Shot 4 s); Ambush damage estimate"
energy_per_minute = 600  # Classic energy regen 20 per 2 s

[[controls]]
name = "Cheap Shot"
kind = "stun"  # stun | incapacitate | disorient | fear | root | slow | interrupt | silence
duration = 4.0
cooldown = 0
energy = 60  # data
source = "data"

[[controls]]
name = "Kidney Shot"
kind = "stun"  # stun | incapacitate | disorient | fear | root | slow | interrupt | silence
duration = 6.0
cooldown = 20
energy = 125  # data 25 + estimate 100 for the combo points
source = "data: 1 s + 1 s per combo point, 5 combo points"

[[controls]]
name = "Gouge"
kind = "stun"  # stun | incapacitate | disorient | fear | root | slow | interrupt | silence
duration = 5.5
cooldown = 10
energy = 45  # data
source = "data: 4 s + Improved Gouge 3/3 1.5 s"

[[controls]]
name = "Kick"
kind = "interrupt"  # stun | incapacitate | disorient | fear | root | slow | interrupt | silence
duration = 5.0
cooldown = 10
energy = 25  # data
source = "data"

[[controls]]
name = "Blind"
kind = "disorient"  # stun | incapacitate | disorient | fear | root | slow | interrupt | silence
duration = 10.0
cooldown = 200
energy = 30  # data
source = "data: 10 s disorient with a 60% slow, 5 min; Preparation resets it (classic 10 min cooldown) -> 3 per 10 min"

[[gap_closers]]
name = "Sprint"
cooldown = 200  # data 5 min, Preparation reset -> 3 per 10 min

[[removes]]
name = "Sprint"
removes = "slow,root"
cooldown = 200  # data: Improved Sprint 2/2 removes movement impairing effects; Preparation reset

[[removes]]
name = "Vanish"
removes = "slow,root"
cooldown = 200  # data 5 min, Preparation reset
