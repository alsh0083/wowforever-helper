# Hunter Survival: PvP opponent kit for the duel model (docs/design/pvp-duel-model.md).
# Spec chosen from wowforevertalent.com Forever popularity data plus PvP judgment.
# source per value: data = Forever client 1.60.1.70205; classic = Classic value the data reader
# can't see yet; estimate = judgment. Health and DPS: level-60 estimates vs cloth (low confidence).

id = "hunter-survival"
class = "Hunter"
spec = "Survival"
points = "5/11/35"
role = "ranged"  # melee | ranged | caster
stealth = false
dispels_buffs = false  # can strip Ice Barrier
confidence = "low"
sources = ["wft_popular"]

[at_60]
health = 3700
dps = 230  # sustained vs cloth when in range
opener_damage = 600
opener_stun = 0.0
opener_source = "estimate (Aimed Shot opener)"

[[controls]]
name = "Concussive Shot"
kind = "slow"  # stun | incapacitate | fear | root | slow | interrupt | silence
duration = 4.0
cooldown = 12
source = "data"

[[controls]]
