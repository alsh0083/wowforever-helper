# Hunter Survival (Lone Wolf): PvP opponent kit for the duel model (docs/design/pvp-duel-model.md).
# From the hunter community PvP build (#108, config/builds/hunter-survival-pvp.toml, 5/11/35):
# Forever's Survival is petless dual-wield melee (Lone Wolf, Predator's Edge, Strider Kick), so the
# kit fights in melee and has no pet stun or Scatter Shot (#110).
# source per value: data = Forever client 1.60.1.70205 hunter spells and the build's talents;
# estimate = judgment. Health and DPS: level-60 values vs cloth from the melee engine (#147).

id = "hunter-survival"
class = "Hunter"
spec = "Survival (Lone Wolf melee)"
points = "5/11/35"
role = "melee"  # melee | ranged | caster
stealth = false
dispels_buffs = false  # can strip Ice Barrier
confidence = "low"
sources = ["wft_popular", "wft_popular_hunter"]

[at_60]
health = 3160  # melee engine (#147), build hunter-survival-pvp
dps = 327  # melee engine (#147), build hunter-survival-pvp
opener_damage = 400
opener_stun = 0.0
opener_source = "estimate (closes to melee; no stun opener)"

[[controls]]
name = "Wing Clip"
kind = "slow"  # stun | incapacitate | disorient | fear | root | slow | interrupt | silence
duration = 10.0
cooldown = 0
source = "data: 60% slow for 10 s, 5 yd"

[[controls]]
name = "Concussive Shot"
kind = "slow"  # stun | incapacitate | disorient | fear | root | slow | interrupt | silence
duration = 4.0
cooldown = 12
source = "data: 50% slow"

[[controls]]
name = "Freezing Trap"
kind = "incapacitate"  # stun | incapacitate | disorient | fear | root | slow | interrupt | silence
duration = 5.0
cooldown = 18
source = "data 30 s cooldown, Survivalist's Discipline 2/2 -40%; duration estimate: breaks on damage, so ~5 s of real lockout"

[[controls]]
name = "Frost Trap (Entrapment)"
kind = "root"  # stun | incapacitate | disorient | fear | root | slow | interrupt | silence
duration = 5.0
cooldown = 18
source = "data: Entrapment 3/5 roots on trap trigger; trap cooldown 30 s, Survivalist's Discipline -40%"

[[removes]]
name = "Surefooted"
removes = "slow"
cooldown = 0  # passive: movement impairing effects 30% shorter (Surefooted 3/3); counts as cheap removal
