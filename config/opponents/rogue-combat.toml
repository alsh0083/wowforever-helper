# Rogue Combat (Blade Flurry, Adrenaline Rush): PvP opponent kit for the duel model (docs/design/pvp-duel-model.md).
# Second PvP spec for the class (#81), from wowforevertalent.com Forever popularity data plus judgment.
# source per value: data = Forever client 1.60.1.70205 rogue spells and the talents of the rogue
# community build (#106, config/builds/rogue-*.toml); classic = Classic value the data doesn't carry;
# estimate = judgment. Health and DPS: level-60 values vs cloth from the melee engine (#147).

id = "rogue-combat"
class = "Rogue"
spec = "Combat (Blade Flurry, Adrenaline Rush)"
points = "18/32/0"
role = "melee"  # melee | ranged | caster
stealth = true
dispels_buffs = false  # can strip Ice Barrier
confidence = "low"
sources = ["wft_popular", "wft_popular_rogue"]

[at_60]
health = 3280  # melee engine (#147), build rogue-combat-pvp
dps = 273  # melee engine (#147), build rogue-combat-pvp
opener_damage = 700
opener_stun = 4.0
opener_source = "data (Cheap Shot 4 s); Ambush/Sinister Strike damage estimate"
energy_per_minute = 600  # Classic energy regen 20 per 2 s

[[controls]]
name = "Cheap Shot"
kind = "stun"  # stun | incapacitate | disorient | fear | root | slow | interrupt | silence
duration = 4.0
cooldown = 0
energy = 60  # data
source = "data"

[[controls]]
name = "Kidney Shot"
kind = "stun"  # stun | incapacitate | disorient | fear | root | slow | interrupt | silence
duration = 6.0
cooldown = 20
energy = 125  # data 25 + estimate 100 for the combo points
source = "data: 1 s + 1 s per combo point, 5 combo points"

[[controls]]
name = "Gouge"
kind = "stun"  # stun | incapacitate | disorient | fear | root | slow | interrupt | silence
duration = 4.0
cooldown = 10
energy = 45  # data
source = "data"

[[controls]]
name = "Blind"
kind = "disorient"  # stun | incapacitate | disorient | fear | root | slow | interrupt | silence
duration = 10.0
cooldown = 300
energy = 30  # data
source = "data: 10 s disorient with a 60% slow, 5 min cooldown"

[[controls]]
name = "Kick"
kind = "interrupt"  # stun | incapacitate | disorient | fear | root | slow | interrupt | silence
duration = 5.0
cooldown = 10
energy = 25  # data
source = "data"

[[gap_closers]]
name = "Sprint"
cooldown = 120  # data: 5 min, Endurance 2/2 -60%

[[removes]]
name = "Sprint"
removes = "slow,root"
cooldown = 120  # data: Improved Sprint 2/2 removes movement impairing effects; Endurance 2/2 -60%

[[removes]]
name = "Vanish"
removes = "slow,root"
cooldown = 300
