# Warrior rotation constants (#162). Classic values; confidence LOW until checked in Forever.

# Rage from dealing damage: rage = 7.5 * damage / c, c = a * level^2 + b * level + k (Classic)
rage_conversion = { a = 0.0091107836, b = 3.225598133, k = 4.2652911 }
# Bloodrage: 10 rage up front plus 10 over 10 s, every 60 s (data cooldown 60 s; rage Classic)
bloodrage_rage = 20.0
# Anger Management: 1 rage every 3 s in combat (rank text)
anger_management_rage_per_second = 0.333
# Death Wish: +20% Physical damage for 30 s every 3 min (rank text; duration and cooldown Classic)
death_wish = { bonus_pct = 20.0, duration = 30.0, cooldown = 180.0 }
# normalized weapon speed for "normalized" strikes (Classic)
normalized_speed = { one_hand = 2.4, two_hand = 3.3 }

# AoE pulls (#262). Cleave hits this many targets (Classic "the target and his nearest ally"; Forever's
# data has no target count). Whirlwind and Thunder Clap use the data's MaxTargets (4).
cleave_targets = 2
# Sweeping Strikes: "Your next 5 melee attacks strike an additional nearby opponent" (rank text)
sweeping_strikes_attacks = 5
# Flurry lasts this many swings after a crit (rank text: "your next 3 swings", #391)
flurry_swings = 3
