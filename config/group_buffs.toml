# Group buffs and target debuffs that change a party member's damage (#218, plan:
# docs/planning/2026-10-07-party-buffs.md). Values are read from the game client's spell tables by
# `wowforever group-buffs` into data/buffs/group_buffs.json, at the best rank a provider of each level has.
#
# Fields:
#   spell     the spell whose effect carries the value (for totems and talents, the aura they apply)
#   cast      the spell the provider learns, when it differs from `spell` (its learn levels gate the buff)
#   aura      the client EffectAura to read (or effect: the Effect type, for procs); misc: its
#             EffectMiscValue_0 when the aura has several; spell_id pins one spell when names repeat
#   proc_chance  for procs the client data does not carry (Windfury: 20% per hit)
#   stacks    applications that stack on the target (Sunder Armor x5)
#   provider  class, and the talent or tree it needs; tank / healer / any role restricts who provides it
#   stack     stacking group: within a group only the strongest counts, so two providers count once
#   choice    one option per provider from this set (one blessing per paladin on you, one totem per
#             element per shaman, one curse per warlock, one aura per paladin); the provider picks the
#             option best for you (plan D1)
#   reach     who it helps: party, melee, ranged, casters, physical (melee and ranged), or target (a debuff)
#
# Left out, with reasons (checked in the 1.60.1.70205 client):
#   Shadow Weaving, Improved Scorch (Fire Vulnerability) and Winter's Chill: Forever made them caster-only
#     (auras 270 and 308: damage taken from / crit for the caster who applies them), so no party effect.
#   Sanctity Aura: not in Forever's Retribution tree (Sanctified Judgement takes that spot).
#   Vampiric Embrace, Retribution Aura, Power Word: Fortitude, Blood Pact: healing, damage shields or
#     stamina, not damage.
#   Blessing of Wisdom, Mana Spring Totem, Arcane Intellect's mana: the dungeon scenario assumes mana isn't
#     limiting (one pull). Arcane Intellect stays for its spell crit from intellect.

