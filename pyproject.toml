[build-system]
requires = ["setuptools>=77"]  # 77+: SPDX license string
build-backend = "setuptools.build_meta"

[project]
name = "wowforever"
version = "0.0.1"
description = "WoW Forever theorycrafting: versioned talent data, build legality, calculator, dashboard"
license = "MIT"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
wowforever = "wowforever.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider --basetemp=.pytest-tmp"
